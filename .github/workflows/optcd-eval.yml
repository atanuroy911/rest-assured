name: Java CI

on:
- workflow_dispatch
jobs:
  test:
    runs-on:
    - self-hosted
    - optcd
    strategy:
      matrix:
        os:
        - ubuntu-latest
        java:
        - 17
      fail-fast: false
      max-parallel: 4
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java }}
        distribution: 'zulu'
    - name: Verify with Maven
      run: mvn verify -B -Posgi-tests
